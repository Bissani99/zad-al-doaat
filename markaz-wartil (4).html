<title>مركز ورتل – الحضور والغياب</title>

<style>
:root{box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);
--card:#ffffff;--tx:#1b2733;--mut:#6b7a8a;--bd:#e0e5ec;--gold:#d1a23f;--p:#1f9d55;--a:#d93f3f;--l:#d99a1c}

:root[data-mode="dark"][data-th="burgundy"]{--ac:#e58aa8;--acx:#2a0a17;--hd1:#45152a;--hd2:#6e2644;--bg:#1a1013}

*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.5;transition:background .25s}
#hd{position:relative;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 20px;text-align:center;color:#fff;background:linear-gradient(160deg,var(--hd1),var(--hd2));border-bottom:4px solid var(--gold);overflow:hidden}
#hd.sec{padding-top:calc(46px + env(safe-area-inset-top,0px))}
#hd::before{content:"";position:absolute;inset:0;z-index:0;opacity:.12;background-image:radial-gradient(circle at 50% 50%,transparent 0 9px,#fff 9px 10px,transparent 10px),linear-gradient(45deg,transparent 48%,#fff 48% 52%,transparent 52%),linear-gradient(-45deg,transparent 48%,#fff 48% 52%,transparent 52%);background-size:44px 44px}
#hd.deco-sky{padding-bottom:58px}

#hd>*{position:relative;z-index:2}
#hd .logo{display:block;width:min(76%,300px);height:auto;margin:0 auto 6px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.3))}
#hd .emb{width:58px;height:58px;margin:0 auto 4px;color:#ffd45e;filter:drop-shadow(0 2px 5px rgba(0,0,0,.25))}
#hd .emb svg{width:100%;height:100%;display:block}
#hd h1{margin:0;font-family:"Reem Kufi","Tajawal",serif;font-size:30px;font-weight:700;text-shadow:0 2px 6px rgba(0,0,0,.28)}
#hd p{margin:2px 0 0;color:#f3e2a9;font-size:15px}
.back{position:absolute!important;top:calc(10px + env(safe-area-inset-top,0px));right:12px;z-index:3!important;background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:20px;padding:6px 14px;font:inherit;font-size:14px}
main{max-width:560px;margin:0 auto;padding:14px 14px 80px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 1px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-size:13px;font-weight:500;line-height:1.25}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700;box-shadow:0 3px 10px rgba(0,0,0,.18)}
.hello{font-weight:700;font-size:18px;margin:2px 2px 12px;color:var(--ac)}
.hgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.hcard{background:var(--card);border:1px solid var(--bd);border-top:4px solid var(--gold);border-radius:16px;padding:16px 10px 14px;text-align:center;cursor:pointer;box-shadow:0 2px 10px rgba(0,0,0,.06);-webkit-tap-highlight-color:transparent}
.hcard:active{transform:scale(.97)}
.hic{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;padding:14px;color:#ffe08a;box-shadow:0 4px 12px rgba(0,0,0,.22)}
.hic svg{width:100%;height:100%;display:block}
.hn{font-weight:700;font-size:16px;line-height:1.35;min-height:44px;display:flex;align-items:center;justify-content:center}
.hs{color:var(--mut);font-size:13px;margin-top:4px}
.week{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px;border-top:3px solid var(--gold)}
.week button{width:46px;height:46px;border:0;background:none;color:var(--ac);font-size:26px;border-radius:10px}
.week button:disabled{opacity:.25}
.week div{text-align:center;font-weight:700;font-size:17px}
.week small{display:block;color:var(--mut);font-weight:400;font-size:13px}
select,input[type=text],input[type=date],textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
select{margin-top:10px;margin-bottom:6px}
.sum{display:flex;gap:6px;margin:12px 0}
.sum span{flex:1;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 2px;font-size:12px;color:var(--mut)}
.sum b{display:block;font-size:21px;line-height:1.2}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.row.st{flex-direction:column;align-items:stretch;gap:8px}
.nm{flex:1;min-width:0;font-weight:500;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{display:grid;gap:8px}
.bt button{height:44px;border-radius:10px;border:2px solid var(--bd);background:none;color:var(--mut);font:inherit;font-weight:700;font-size:15px}
.bt button.P.on{background:var(--p);border-color:var(--p);color:#fff}
.bt button.A.on{background:var(--a);border-color:var(--a);color:#fff}
.bt button.L.on{background:var(--l);border-color:var(--l);color:#fff}
.act{display:flex;gap:8px;margin:12px 0}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:15px;font-weight:500}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:700}
.btn.dng{background:var(--a);border-color:var(--a);color:#fff;font-weight:700}
textarea{min-height:150px}
.hint{color:var(--mut);font-size:14px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:center}
th{color:var(--ac)}
th:first-child,td:first-child{text-align:right}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px 8px}
.cardx{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:14px;border-top:3px solid var(--gold)}
.cardx h3{margin:0;font-size:17px;color:var(--ac)}
.yrs{display:flex;gap:6px;margin:0 0 12px}
.yrs button{flex:1;padding:9px 2px 7px;border-radius:12px;border:1px solid var(--bd);border-bottom:4px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;font-weight:700;line-height:1.3}
.yrs button small{display:block;font-weight:400;font-size:11px;opacity:.75}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip input{display:none}
.chip span{display:block;padding:7px 11px;border-radius:20px;border:1px solid var(--bd);background:var(--card);font-size:14px}
.chip input:checked+span{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700}
.two{display:flex;gap:8px;margin-top:8px}.two>div{flex:1;min-width:0}.two input{min-width:0;width:100%;max-width:100%;-webkit-appearance:none;appearance:none}
#hd.light{background:#ffffff;color:#1b2733;border-bottom:4px solid var(--hd2);padding-bottom:16px}
#hd.light::before,#hd.light::after{display:none}
#hd.light .logo{width:min(66%,250px);filter:none;margin:0 auto 4px}
#hd.light.sec .logo{width:min(78%,300px)}
#hd.light p{color:#4f5f6f;margin-top:4px}
#hd.light .back{background:rgba(0,0,0,.05);color:#1b2733;border:1px solid #d3dae2}
.hlogo{height:92px;margin-bottom:8px;display:flex;align-items:center;justify-content:center}
.hlogo img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.yrs.g2{display:grid;grid-template-columns:1fr 1fr}
.note{margin-top:2px;padding:9px 11px;font-size:14px}
#hd.logoh .logo{filter:drop-shadow(1.6px 0 0 #fff) drop-shadow(-1.6px 0 0 #fff) drop-shadow(0 1.6px 0 #fff) drop-shadow(0 -1.6px 0 #fff) drop-shadow(0 3px 8px rgba(0,0,0,.35))}
#hd.logoh:not(.sec) .logo{width:min(62%,230px)}
:root[data-mode="dark"] .hlogo img{filter:drop-shadow(1.2px 0 0 #fff) drop-shadow(-1.2px 0 0 #fff) drop-shadow(0 1.2px 0 #fff) drop-shadow(0 -1.2px 0 #fff)}
.curg{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--card);border:1px solid var(--bd);border-bottom:4px solid var(--gold);border-radius:12px;padding:8px 12px;margin-bottom:12px}
.curg b{font-size:16px}
.curg button{border:1px solid var(--bd);background:none;color:var(--ac);border-radius:20px;padding:6px 12px;font:inherit;font-size:13px}
.empty{text-align:center;color:var(--mut);padding:34px 10px}
.ib{width:42px;height:42px;border:0;background:none;font-size:19px;border-radius:10px}
.ib.e{color:var(--ac)}.ib.d{color:var(--a)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--acx);padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30;max-width:92%;text-align:center}
#toast.s{opacity:1}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:center;justify-content:center;padding:20px}
#md.on{display:flex}
#md .box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:380px;border-top:4px solid var(--gold)}
#md p{margin:0 0 14px}

input[type=password],input[type=search],input[type=tel],input[type=number]{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
html #hd.logoh .logo.l-zad,html #hd .logo.l-zad{width:min(54%,200px)}
.hlogo img.l-zad{max-width:74%}
.qrbox{background:#fff;padding:10px;border-radius:16px;max-width:300px;margin:10px auto;line-height:0;border:1px solid var(--bd)}
.qrbox svg{width:100%;height:auto;display:block}
.nbtn{display:block;width:100%;text-align:right;padding:16px;margin-bottom:10px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:18px;font-weight:500}
.nbtn:active{background:var(--ac);color:var(--acx)}
.bigp{display:block;width:100%;padding:22px;font-size:24px;font-weight:700;border-radius:18px;border:0;background:var(--p);color:#fff;font-family:inherit;margin:14px 0}
.okbox{text-align:center;padding:26px 10px}.okbox .big{font-size:64px;line-height:1.1}.okbox h2{margin:8px 0;color:var(--p)}
@media(min-width:700px){main{max-width:780px}.hgrid{grid-template-columns:repeat(3,1fr)}.bt button{height:50px}}
@media(max-width:699px){
body{font-size:17px}
#hd h1{font-size:32px}
main{padding:16px 14px 90px}
.tabs{gap:5px}.tabs button{padding:13px 1px;font-size:14px;border-radius:14px}
.hello{font-size:20px;margin-bottom:14px}
.hgrid{gap:14px}
.hcard{padding:24px 12px 20px;border-radius:20px}
.hic{width:80px;height:80px;padding:17px;margin-bottom:12px}
.hn{font-size:19px;min-height:54px}.hs{font-size:15px;margin-top:6px}
.hlogo{height:108px;margin-bottom:10px}
.week{padding:8px;border-radius:16px}.week button{width:54px;height:54px;font-size:30px}.week div{font-size:19px}
select,input[type=text],input[type=date],input[type=password],input[type=search],textarea{padding:14px;font-size:17px;border-radius:14px}
.sum span{padding:11px 2px;font-size:13px}.sum b{font-size:25px}
.row{padding:14px 14px;border-radius:16px;margin-bottom:12px}
.nm{font-size:19px}
.bt{gap:10px}.bt button{height:56px;font-size:17px;border-radius:12px}
.btn{padding:15px;font-size:17px;border-radius:14px}
.cardx{padding:15px;border-radius:16px}.cardx h3{font-size:19px}
.hint{font-size:15px}
.chip span{padding:10px 14px;font-size:16px}
.ib{width:48px;height:48px;font-size:22px}
th,td{padding:11px 6px}table{font-size:15px}
.curg{padding:12px 14px}.curg b{font-size:18px}.curg button{padding:9px 14px;font-size:15px}
}
.cntr{display:flex;align-items:center;gap:12px;justify-content:space-between;background:var(--bg);border:1px solid var(--bd);border-radius:12px;padding:6px 12px}
.cntr span{font-weight:500}.cntr b{font-size:24px;min-width:34px;text-align:center}
.cntr button{width:48px;height:48px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--ac);font-size:28px;font-family:inherit}
.qrbox{padding:6px!important}
@media print{#hd,main,#toast{display:none!important}body{background:#fff!important}#md{position:static!important;background:#fff!important;padding:0!important;display:block!important}#md .box{max-width:none!important;border:0!important;background:#fff!important;color:#000!important}.noprint{display:none!important}}
#thm{position:fixed;bottom:12px;left:12px;z-index:40;width:44px;height:44px;border-radius:50%;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:21px;opacity:.93;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.22);cursor:pointer}
@media print{#thm{display:none!important}}
</style>

/* رفع ودمج البيانات في السحابة (نسخ احتياطية، بيانات الهاتف القديمة، التطبيقات القديمة) */
function gUpload(sid,d){var ops=[],t=Date.now(),g0=(d.groups&&d.groups[0]&&d.groups[0].id)||"g1",dm=dedupMap(sid,d.students||[]);UP={add:dm.fresh.length,merge:Object.keys(dm.map).length};
function rm(m,ex){var o={};Object.keys(m).forEach(function(i){var tid=dm.map[i];if(tid){if(ex[tid]===undefined&&o[tid]===undefined)o[tid]=m[i]}else o[i]=m[i]});return o}
var DS=D.sec[sid]||{att:{},notes:{}};
if(d.groups&&d.groups.length)ops.push(function(b){b.set(db.collection("sections").doc(sid),{groups:d.groups},{merge:true})});
dm.fresh.forEach(function(s,i){ops.push(function(b){b.set(db.collection("gstudents").doc(s.id),{sec:sid,gid:s.gid||g0,name:s.name,ts:s.ts||t+i},{merge:true})})});
Object.keys(d.att||{}).forEach(function(k){var m=rm(d.att[k]||{},(DS.att||{})[k]||{});if(m&&Object.keys(m).length)ops.push(function(b){b.set(db.collection("gatt").doc(sid+"_"+k),{sec:sid,date:k,marks:m},{merge:true})})});
Object.keys(d.notes||{}).forEach(function(k){var m=rm(d.notes[k]||{},(DS.notes||{})[k]||{});if(m&&Object.keys(m).length)ops.push(function(b){b.set(db.collection("gatt").doc(sid+"_"+k),{sec:sid,date:k,notes:m},{merge:true})})});
Object.keys(d.saved||{}).forEach(function(x){var p=x.split("|");if(p.length==2){var o={};o[p[1]]=d.saved[x];ops.push(function(b){b.set(db.collection("gatt").doc(sid+"_"+p[0]),{sec:sid,date:p[0],saved:o},{merge:true})})}});
return commitOps(ops)}

l.innerHTML=ids.length?ids.map(function(i){return'<button class="nbtn" onclick="SD.sel=\''+i+'\';stuView()">'+esc(nm[i].n)+'</button>'}).join(""):'<div class="empty">لا يوجد اسم مطابق.<br>إن لم تجد اسمك فقد يكون مربوطاً بهاتف آخر، راجع المعلم.</div>'}
function stuSearch(v){SD.q=v;stuList()}
setInterval(function(){if(!SM)return;var e=document.getElementById("sct");if(!e)return;var id=meId(),n=id&&SD.ck&&SD.ck.names[id],o=n?opNow(n.g):null;if(!o){stuView();return}e.textContent=fmtT(o.u-Date.now())},1000);
function stuView(){var hd=document.getElementById("hd"),v=document.getElementById("v"),tb=document.getElementById("tabs");
document.documentElement.setAttribute("data-th","green");tb.style.display="none";
hd.className="deco-lat logoh";hd.innerHTML='<img class="logo l-zad" src="'+IMG.zad+'" alt="زاد الدعاة"><p>تسجيل الحضور'+(SD.td?" – "+esc(shortD(pd(SD.td))):"")+' <small style="opacity:.55;font-size:11px">· '+APPV+'</small></p>';
if(document.activeElement&&document.activeElement.id==="sq"&&SD.gsel&&SD.got===15){stuList();return}
function msg(t){v.innerHTML='<div class="empty">'+t+'</div>'}
if(MT.on)return msg(maintView());if(SD.err)return msg("⚠️ "+SD.err);if(SD.got!==15)return msg("جارٍ التحميل…");
var ck=SD.ck;if(!ck||!ck.names)return msg("⛔ لم يُفعَّل التسجيل بعد.<br>اطلب من المعلم فتح التطبيق مرة واحدة.");
var id=meId();
if(id&&ck.names[id]){var nm=ck.names[id],g=ck.groups[nm.g];
if(SD.cp[id]){v.innerHTML='<div class="okbox"><div class="big">✅</div><h2>تم تسجيل حضورك</h2><div style="font-size:22px;font-weight:700">'+esc(nm.n)+'</div><div class="hint">'+esc(g?g.n:"")+'</div></div>';return}
var head='<div class="cardx" style="text-align:center"><div class="hint" style="margin-top:0">أهلاً بك</div><div style="font-size:26px;font-weight:700;margin:6px 0">'+esc(nm.n)+'</div><div class="hint">'+esc(g?g.n:"")+'</div>';
var og=opNow(nm.g);if(og){v.innerHTML=head+'<div class="hint" style="font-size:18px">⏱ يتبقى <b id="sct" dir="ltr" style="color:var(--p)">'+fmtT(og.u-Date.now())+'</b></div><button class="bigp" onclick="stuPresent(\''+id+'\')">✔ أنا حاضر</button><div class="hint">هذا الاسم مربوط بهاتفك. إن كان خطأ فراجع المعلم.</div></div>';return}
var ex=SD.op[nm.g];if(ex&&typeof ex==="object"&&ex.d===SD.td){v.innerHTML=head+'<div class="empty" style="padding:14px 0">⌛ انتهى وقت تسجيل الحضور.<br>إن كنت حاضراً فأخبر المعلم ليسجّلك يدوياً.</div></div>';return}
v.innerHTML=head+(schedToday(g)?'<div class="empty" style="padding:14px 0">⏳ لم يبدأ تسجيل الحضور بعد.<br>سيفتحه المعلم أثناء الحصة، وسيظهر هنا زر «أنا حاضر» تلقائياً.</div>':'<div class="empty" style="padding:14px 0">لا توجد حصة لـ'+esc(g?g.n:"سنتك")+' اليوم.'+(g&&g.d&&g.d.length?'<br>أيام الحصص: '+g.d.map(function(i){return DAYS[i]}).join(" و "):'')+'</div>')+'</div>';return}
if(SD.sel&&ck.names[SD.sel]&&!SD.cl[SD.sel]){v.innerHTML='<div class="cardx" style="text-align:center"><div class="hint" style="margin-top:0">هل هذا اسمك؟</div><div style="font-size:26px;font-weight:700;margin:8px 0 14px">'+esc(ck.names[SD.sel].n)+'</div><button class="bigp" onclick="stuClaim(\''+SD.sel+'\')">✔ نعم، هذا اسمي</button><button class="btn" style="width:100%" onclick="SD.sel=null;stuView()">رجوع</button><div class="hint">⚠️ سيُربط هذا الاسم بهذا الهاتف ولا يمكن تغييره إلا عن طريق المعلم.</div></div>';return}
if(!SD.gsel){var gs=Object.keys(ck.groups).sort();v.innerHTML='<div class="hint" style="font-size:18px;margin-top:0">مرحباً! اختر سنتك الدراسية:</div>'+gs.map(function(k){return'<button class="nbtn" onclick="SD.gsel=\''+k+'\';SD.q=\'\';stuView()">'+esc(ck.groups[k].n)+'</button>'}).join("");return}
v.innerHTML='<div class="curg"><b>'+esc(ck.groups[SD.gsel]?ck.groups[SD.gsel].n:"")+'</b><button onclick="SD.gsel=null;stuView()">⇄ تغيير السنة</button></div><div class="hint" style="font-size:17px;margin-top:0">اختر اسمك من القائمة:</div><input type="search" id="sq" placeholder="🔍 ابحث عن اسمك" value="'+esc(SD.q||"")+'" oninput="stuSearch(this.value)" style="margin-bottom:12px"><div id="sl"></div>';stuList()}

modeBtn();
if(SM){stuStart()}else{fbInit();render()}
</script>
</body>
</html>
