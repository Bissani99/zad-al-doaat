<title>معهد زاد الدعاة – سجل الحضور</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Reem+Kufi:wght@500;700&display=swap">
<style>
:root{box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f1e6;--card:#fffdf8;--tx:#1d2a26;--mut:#6f7b75;--bd:#e6dcc6;--ac:#0f5c4a;--acx:#fff;--gold:#c19a49;
--p:#1b8a55;--a:#c8403f;--l:#d99a1c;--hd1:#0c4a3c;--hd2:#12705a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a17;--card:#182622;--tx:#eef2ef;--mut:#9bb0a8;--bd:#2a3d37;--ac:#3fb68f;--acx:#06251c;--gold:#d8b565;--p:#3ec97a;--a:#f07272;--l:#f0b440;--hd1:#08362b;--hd2:#0d4d3e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a17;--card:#182622;--tx:#eef2ef;--mut:#9bb0a8;--bd:#2a3d37;--ac:#3fb68f;--acx:#06251c;--gold:#d8b565;--p:#3ec97a;--a:#f07272;--l:#f0b440;--hd1:#08362b;--hd2:#0d4d3e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.5}
header{position:relative;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 20px;text-align:center;color:#fff;
background:linear-gradient(160deg,var(--hd1),var(--hd2));border-bottom:4px solid var(--gold);overflow:hidden}
header::before{content:"";position:absolute;inset:0;opacity:.13;
background-image:radial-gradient(circle at 50% 50%,transparent 0 9px,#fff 9px 10px,transparent 10px),linear-gradient(45deg,transparent 48%,#fff 48% 52%,transparent 52%),linear-gradient(-45deg,transparent 48%,#fff 48% 52%,transparent 52%);
background-size:44px 44px}
header>*{position:relative}
header .logo{display:block;width:min(74%,290px);height:auto;margin:0 auto 8px;filter:drop-shadow(0 2px 6px rgba(0,0,0,.28))}
header h1{margin:0;font-family:"Reem Kufi","Tajawal",serif;font-size:24px;font-weight:700;letter-spacing:.3px;text-shadow:0 2px 6px rgba(0,0,0,.25)}
header p{margin:2px 0 0;color:#f0dfb4;font-size:15px}
main{max-width:560px;margin:0 auto;padding:14px 14px 80px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:9px 1px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-size:13px;font-weight:500;line-height:1.25}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700;box-shadow:0 3px 10px rgba(15,92,74,.25)}
.week{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px;border-top:3px solid var(--gold)}
.week button{width:46px;height:46px;border:0;background:none;color:var(--ac);font-size:26px;border-radius:10px}
.week button:disabled{opacity:.25}
.week div{text-align:center;font-weight:700;font-size:17px}
.week small{display:block;color:var(--mut);font-weight:400;font-size:13px}
select,input[type=text],input[type=email],input[type=password],textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
select{margin-top:10px}
.sum{display:flex;gap:8px;margin:12px 0}
.sum span{flex:1;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 2px;font-size:13px;color:var(--mut)}
.sum b{display:block;font-size:22px;line-height:1.2}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.row.st{flex-direction:column;align-items:stretch;gap:8px}
.nm{flex:1;min-width:0;font-weight:500;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bt button{height:44px;border-radius:10px;border:2px solid var(--bd);background:none;color:var(--mut);font:inherit;font-weight:700;font-size:15px}
.bt button.P.on{background:var(--p);border-color:var(--p);color:#fff}
.bt button.A.on{background:var(--a);border-color:var(--a);color:#fff}
.bt button.L.on{background:var(--l);border-color:var(--l);color:#fff}
.act{display:flex;gap:8px;margin:12px 0}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:15px;font-weight:500}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:700}
.btn.dng{background:var(--a);border-color:var(--a);color:#fff;font-weight:700}
textarea{min-height:150px}
.hint{color:var(--mut);font-size:14px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:center}
th{color:var(--ac)}
th:first-child,td:first-child{text-align:right}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px 8px}
.yrs{display:flex;gap:6px;margin:0 0 12px}
.yrs button{flex:1;padding:9px 2px 7px;border-radius:12px;border:1px solid var(--bd);border-bottom:4px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:14px;font-weight:700;line-height:1.3}
.yrs button small{display:block;font-weight:400;font-size:11px;color:var(--mut)}
.yrs button.y1{border-bottom-color:var(--c1)}.yrs button.y2{border-bottom-color:var(--c2)}.yrs button.y3{border-bottom-color:var(--c3)}
.yrs button.y1.on{background:var(--c1);border-color:var(--c1);color:var(--c1x)}
.yrs button.y2.on{background:var(--c2);border-color:var(--c2);color:var(--c2x)}
.yrs button.y3.on{background:var(--c3);border-color:var(--c3);color:var(--c3x)}
.yrs button.on small{color:inherit;opacity:.85}
.cardx{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:14px;border-top:3px solid var(--gold)}
.cardx h3{margin:0;font-size:17px;color:var(--ac)}
.stat{text-align:center;font-size:12px;color:var(--mut);margin:-4px 0 10px}
.empty{text-align:center;color:var(--mut);padding:34px 10px}
.ib{width:42px;height:42px;border:0;background:none;font-size:19px;border-radius:10px}
.ib.e{color:var(--ac)}.ib.d{color:var(--a)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--acx);padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
#toast.s{opacity:1}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:center;justify-content:center;padding:20px}
#md.on{display:flex}
#md .box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:380px;border-top:4px solid var(--gold)}
#md p{margin:0 0 14px}

:root{--c1:#0f5c4a;--c1x:#fff;--c2:#1f5fa8;--c2x:#fff;--c3:#8b2d4f;--c3x:#fff}
:root[data-y="2"]{--ac:var(--c2);--acx:var(--c2x);--hd1:#123e73;--hd2:#2a74c4}
:root[data-y="3"]{--ac:var(--c3);--acx:var(--c3x);--hd1:#62203a;--hd2:#a83d63}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){--c1:#3fb68f;--c1x:#06251c;--c2:#6aa9f0;--c2x:#06182b;--c3:#e58aa8;--c3x:#2a0a17}
:root[data-y="2"]:not([data-theme="light"]){--hd1:#0b2a4f;--hd2:#174a85}
:root[data-y="3"]:not([data-theme="light"]){--hd1:#45152a;--hd2:#6e2644}}
:root[data-theme="dark"]{--c1:#3fb68f;--c1x:#06251c;--c2:#6aa9f0;--c2x:#06182b;--c3:#e58aa8;--c3x:#2a0a17}
:root[data-theme="dark"][data-y="2"]{--hd1:#0b2a4f;--hd2:#174a85}
:root[data-theme="dark"][data-y="3"]{--hd1:#45152a;--hd2:#6e2644}
header,.tabs button,.btn,.week{transition:background .25s,border-color .25s}

h+='<div class="hint" style="text-align:center">'+(sv?"✓ آخر حفظ لهذه الحصة: "+fmtT(sv):"اضغط «حفظ الحصة» عند الانتهاء لإنشاء ملف نصي بأسماء الطلاب وحضورهم.")+'</div>';
h+='<div class="hint">كل تسجيل يُحفظ تلقائياً على هذا الهاتف أيضاً. علامة ✓ في القائمة تعني أن الحصة مسجّلة لهذه السنة.</div>'}
}
}else if(tab==2){
if(yr===null)h+=NOYR;
else{var ks=keys();
if(!st.length||!ks.length)h+='<div class="empty">لم يُسجَّل أي حضور بعد لـ '+YN[yr]+'.</div>';
else{h+='<div class="wrap"><table><tr><th>الاسم</th><th>حاضر</th><th>غائب</th><th>متأخر</th><th>النسبة</th></tr>';
st.forEach(function(s){var t=stats(s.id),n=t.P+t.A+t.L;h+='<tr><td>'+esc(s.name)+'</td><td style="color:var(--p)">'+t.P+'</td><td style="color:var(--a)">'+t.A+'</td><td style="color:var(--l)">'+t.L+'</td><td>'+(n?Math.round((t.P+t.L)/n*100)+"%":"–")+'</td></tr>'});
h+='</table></div><div class="hint">'+YN[yr]+' – عدد الحصص المسجّلة: '+ks.length+'. النسبة = (حاضر + متأخر) ÷ الحصص المسجّلة للطالب.</div><div class="act"><button class="btn pri" onclick="expC()">حفظ الجدول كملف Excel</button><button class="btn" onclick="copy()">نسخ</button></div>'}}
}else if(tab==3){
if(yr===null)h+=NOYR;
else{
h+='<div class="hint">اكتب أو الصق الأسماء لإضافتها إلى <b>'+YN[yr]+'</b>، اسماً في كل سطر:</div><textarea id="ns" placeholder="محمد أحمد&#10;خالد علي&#10;..."></textarea><div class="act"><button class="btn pri" onclick="addS()">إضافة الطلاب</button></div>';
if(st.length)h+='<div class="hint">عدد طلاب '+YN[yr]+': '+st.length+' · ✎ تعديل أو نقل لسنة أخرى · ✕ حذف.</div>';
st.forEach(function(s){
if(editId===s.id)h+='<div class="row" style="flex-wrap:wrap"><input type="text" id="en" style="flex:1 1 100%" value="'+esc(s.name)+'" onkeydown="if(event.key===\'Enter\')saveE()"><select id="ey" style="margin:0;flex:1">'+[1,2,3].map(function(n){return'<option value="'+n+'"'+(s.year===n?" selected":"")+'>'+YN[n]+'</option>'}).join("")+'</select><button class="ib e" onclick="saveE()">✔</button><button class="ib d" onclick="cancelE()">✕</button></div>';
else h+='<div class="row"><div class="nm">'+esc(s.name)+'</div><button class="ib e" aria-label="تعديل" onclick="editS(\''+s.id+'\')">✎</button><button class="ib d" aria-label="حذف" onclick="delS(\''+s.id+'\')">✕</button></div>'});
}
}else if(tab==4){
h+='<div class="hint">لكل سنة دراسية زر استيراد خاص بها. اختر ملفاً (Excel أو csv أو txt) أو الصق الأسماء من واتساب أو Excel أو Word.</div>';
[1,2,3].forEach(function(n){var cc=D.students.filter(function(s){return s.year===n}).length;
h+='<div class="cardx" style="border-top-color:var(--c'+n+')"><h3 style="color:var(--c'+n+')">'+YN[n]+' <small style="color:var(--mut);font-weight:400">('+cc+' طالب)</small></h3>';
h+='<div class="act" style="margin-top:6px"><button class="btn" onclick="document.getElementById(\'if'+n+'\').click()">📂 اختيار ملف</button><button class="btn" onclick="pasteC('+n+')">📋 لصق</button></div>';
h+='<input id="if'+n+'" type="file" accept=".txt,.csv,.xlsx,.xls,text/plain,text/csv" style="display:none" onchange="impF(this,'+n+')">';
h+='<textarea id="imp'+n+'" oninput="cnt('+n+')" style="min-height:90px" placeholder="الأسماء تظهر هنا، اسم في كل سطر.&#10;يمكنك التعديل قبل الإضافة."></textarea>';
h+='<div class="hint" id="icnt'+n+'">عدد الأسماء: 0</div>';
h+='<div class="act" style="margin-bottom:0"><button class="btn pri" style="background:var(--c'+n+');border-color:var(--c'+n+');color:var(--c'+n+'x)" onclick="addImp('+n+')">إضافة إلى '+YN[n]+'</button></div></div>'});
h+='<div class="hint">يتم حذف الترقيم والأسماء المكررة تلقائياً. في ملف Excel يُقرأ أول عمود فيه أسماء من الورقة الأولى. (قراءة Excel تحتاج إنترنت.)</div>';
}else{
h+='<div class="hint">بياناتك محفوظة في السحابة ومتزامنة مباشرة بين الأجهزة. يمكنك أيضاً حفظ ملف نسخة احتياطية خاصة بك يشمل السنوات الثلاث. على الهاتف ستظهر قائمة المشاركة: اختر «حفظ في الملفات» (آيفون) أو «حفظ على الجهاز» / Drive (أندرويد) ثم اختر المجلد. على الكمبيوتر (Chrome أو Edge) يُطلب منك اختيار المجلد مباشرة.</div>';
h+='<div class="hint"><b>آخر نسخة احتياطية:</b> '+lastB()+'</div>';
h+='<div class="act"><button class="btn pri" onclick="expJ()">حفظ ملف النسخة الاحتياطية</button></div>';
h+='<div class="act"><button class="btn" onclick="document.getElementById(\'fi\').click()">دمج ملف نسخة احتياطية في السحابة</button></div><input id="fi" type="file" accept=".json,application/json" style="display:none" onchange="impJ(this)">';
if(localOld())h+='<div class="act"><button class="btn" onclick="uploadOld()">⬆️ رفع بيانات هذا الهاتف القديمة إلى السحابة</button></div>';
h+='<div class="hint">نصيحة: احفظ نسخة في نهاية كل شهر. على أي هاتف جديد يكفي تسجيل الدخول لتظهر كل البيانات تلقائياً.</div>';
h+='<div class="hint">الحساب: <b dir="ltr">'+esc(user.email)+'</b></div><div class="act"><button class="btn dng" onclick="logout()">تسجيل الخروج</button></div>';
}
document.getElementById("v").innerHTML=h}
document.getElementById("t1").onclick=function(){tab=1;render()};
document.getElementById("t2").onclick=function(){tab=2;render()};
document.getElementById("t3").onclick=function(){tab=3;editId=null;render()};
document.getElementById("t4").onclick=function(){tab=4;render()};
document.getElementById("t5").onclick=function(){tab=5;render()};

function stat(){var e=document.getElementById("st");if(!e)return;if(!user){e.style.display="none";return}e.style.display="block";e.textContent=navigator.onLine?"🟢 متزامن مباشرة · "+(user.email||""):"🟠 بدون إنترنت – تُحفظ التغييرات وتتزامن عند عودة الاتصال"}
window.addEventListener("online",stat);window.addEventListener("offline",stat);
function busy(){var a=document.activeElement,t=a&&a.tagName;return t==="TEXTAREA"||t==="INPUT"||t==="SELECT"}
function liveRender(){if(busy()){pend=true;return}if(tab===4)return;render()}
document.addEventListener("focusout",function(){if(pend){setTimeout(function(){if(!busy()){pend=false;if(tab!==4)render()}},250)}});
function maybeMigrate(){if(offered||!srv.s||!srv.a)return;offered=true;var o=localOld(),f=null;try{f=localStorage.getItem("attendance-migrated")}catch(e){}if(!o||f||D.students.length)return;
ask("وجدنا بيانات على هذا الهاتف ("+o.students.length+" طالب). هل تريد رفعها إلى السحابة لتظهر على كل الأجهزة؟","رفع البيانات",function(){try{localStorage.setItem("attendance-migrated","1")}catch(e){}upload(o)})}
function got(w,sn){has[w]=true;if(!sn.metadata.fromCache)srv[w]=true;var was=loaded;loaded=has.s&&has.a;denied=false;if(loaded&&!was)render();else if(loaded)liveRender();maybeMigrate()}
function snapErr(e){denied=!!(e&&e.code==="permission-denied");loaded=true;render()}
function startSync(){stopSync();loaded=false;has={s:false,a:false};srv={s:false,a:false};offered=false;
unsub.push(db.collection("students").onSnapshot(function(sn){D.students=sn.docs.map(function(d){var x=d.data();return{id:d.id,name:x.name||"",year:x.year||1,ts:x.ts||0}}).sort(function(a,b){return a.ts-b.ts||a.name.localeCompare(b.name)});got("s",sn)},snapErr));
unsub.push(db.collection("att").onSnapshot(function(sn){var att={},sv={};sn.docs.forEach(function(d){var x=d.data();att[d.id]=x.marks||{};if(x.saved)Object.keys(x.saved).forEach(function(y){sv[d.id+"|"+y]=x.saved[y]})});D.att=att;D.saved=sv;got("a",sn)},snapErr))}
function stopSync(){unsub.forEach(function(f){try{f()}catch(e){}});unsub=[]}
function loginMsg(m){var e=document.getElementById("lm");if(e)e.textContent=m}
function login(){var e=document.getElementById("em").value.trim(),p=document.getElementById("pw").value;if(!e||!p){loginMsg("اكتب البريد الإلكتروني وكلمة المرور");return}
loginMsg("⏳ جارٍ الدخول…");
auth.signInWithEmailAndPassword(e,p).catch(function(er){var c=er&&er.code,m="تعذّر تسجيل الدخول";
if(c==="auth/invalid-credential"||c==="auth/wrong-password"||c==="auth/user-not-found"||c==="auth/invalid-login-credentials")m="البريد أو كلمة المرور غير صحيحة";
else if(c==="auth/invalid-email")m="صيغة البريد الإلكتروني غير صحيحة";
else if(c==="auth/network-request-failed")m="لا يوجد اتصال بالإنترنت";
else if(c==="auth/too-many-requests")m="محاولات كثيرة، حاول لاحقاً";
loginMsg(m)})}
function logout(){ask("هل تريد تسجيل الخروج؟","خروج",function(){auth.signOut()})}
function fbInit(){
if(typeof firebase==="undefined"){fbFail=true;authReady=true;render();return}
try{firebase.initializeApp(CFG);auth=firebase.auth();db=firebase.firestore();FV=firebase.firestore.FieldValue;
try{db.enablePersistence({synchronizeTabs:true}).catch(function(){})}catch(e){}
auth.onAuthStateChanged(function(u){user=u;authReady=true;if(u){startSync()}else{stopSync();D={students:[],att:{},saved:{}};loaded=false;denied=false;tab=1;yr=null;cur=null}render()})}
catch(e){fbFail=true;authReady=true;render()}}
fbInit();render();
</script>
</body>
</html>
