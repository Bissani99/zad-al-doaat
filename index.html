<style>
:root{box-sizing:border-box;padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f6f1e6;--card:#fffdf8;--tx:#1d2a26;--mut:#6f7b75;--bd:#e6dcc6;--ac:#0f5c4a;--acx:#fff;--gold:#c19a49;
--p:#1b8a55;--a:#c8403f;--l:#d99a1c;--hd1:#0c4a3c;--hd2:#12705a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0f1a17;--card:#182622;--tx:#eef2ef;--mut:#9bb0a8;--bd:#2a3d37;--ac:#3fb68f;--acx:#06251c;--gold:#d8b565;--p:#3ec97a;--a:#f07272;--l:#f0b440;--hd1:#08362b;--hd2:#0d4d3e}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0f1a17;--card:#182622;--tx:#eef2ef;--mut:#9bb0a8;--bd:#2a3d37;--ac:#3fb68f;--acx:#06251c;--gold:#d8b565;--p:#3ec97a;--a:#f07272;--l:#f0b440;--hd1:#08362b;--hd2:#0d4d3e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Tajawal","Segoe UI",Tahoma,system-ui,sans-serif;font-size:16px;line-height:1.5}
header{position:relative;padding:calc(18px + env(safe-area-inset-top,0px)) 16px 20px;text-align:center;color:#fff;
background:linear-gradient(160deg,var(--hd1),var(--hd2));border-bottom:4px solid var(--gold);overflow:hidden}
header::before{content:"";position:absolute;inset:0;opacity:.13;
background-image:radial-gradient(circle at 50% 50%,transparent 0 9px,#fff 9px 10px,transparent 10px),linear-gradient(45deg,transparent 48%,#fff 48% 52%,transparent 52%),linear-gradient(-45deg,transparent 48%,#fff 48% 52%,transparent 52%);
background-size:44px 44px}
header>*{position:relative}
header svg{width:44px;height:44px;display:block;margin:0 auto 4px}
header h1{margin:0;font-family:"Reem Kufi","Tajawal",serif;font-size:30px;font-weight:700;letter-spacing:.3px;text-shadow:0 2px 6px rgba(0,0,0,.25)}
header p{margin:2px 0 0;color:#f0dfb4;font-size:15px}
main{max-width:560px;margin:0 auto;padding:14px 14px 80px}
.tabs{display:flex;gap:6px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 2px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:12px;font:inherit;font-size:14px;font-weight:500;white-space:nowrap}
.tabs button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:700;box-shadow:0 3px 10px rgba(15,92,74,.25)}
.week{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:6px;border-top:3px solid var(--gold)}
.week button{width:46px;height:46px;border:0;background:none;color:var(--ac);font-size:26px;border-radius:10px}
.week button:disabled{opacity:.25}
.week div{text-align:center;font-weight:700;font-size:17px}
.week small{display:block;color:var(--mut);font-weight:400;font-size:13px}
select,input[type=text],textarea{width:100%;padding:11px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit}
select{margin-top:10px}
.sum{display:flex;gap:8px;margin:12px 0}
.sum span{flex:1;text-align:center;background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:8px 2px;font-size:13px;color:var(--mut)}
.sum b{display:block;font-size:22px;line-height:1.2}
.row{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 12px;margin-bottom:10px}
.row.st{flex-direction:column;align-items:stretch;gap:8px}
.nm{flex:1;min-width:0;font-weight:500;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bt{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.bt button{height:44px;border-radius:10px;border:2px solid var(--bd);background:none;color:var(--mut);font:inherit;font-weight:700;font-size:15px}
.bt button.P.on{background:var(--p);border-color:var(--p);color:#fff}
.bt button.A.on{background:var(--a);border-color:var(--a);color:#fff}
.bt button.L.on{background:var(--l);border-color:var(--l);color:#fff}
.act{display:flex;gap:8px;margin:12px 0}
.btn{flex:1;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font:inherit;font-size:15px;font-weight:500}
.btn.pri{background:var(--ac);border-color:var(--ac);color:var(--acx);font-weight:700}
.btn.dng{background:var(--a);border-color:var(--a);color:#fff;font-weight:700}
textarea{min-height:150px}
.hint{color:var(--mut);font-size:14px;margin:8px 0}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 6px;border-bottom:1px solid var(--bd);text-align:center}
th{color:var(--ac)}
th:first-child,td:first-child{text-align:right}
.wrap{overflow-x:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:4px 8px}
.empty{text-align:center;color:var(--mut);padding:34px 10px}
.ib{width:42px;height:42px;border:0;background:none;font-size:19px;border-radius:10px}
.ib.e{color:var(--ac)}.ib.d{color:var(--a)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ac);color:var(--acx);padding:10px 18px;border-radius:22px;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:30}
#toast.s{opacity:1}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;align-items:center;justify-content:center;padding:20px}
#md.on{display:flex}
#md .box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:380px;border-top:4px solid var(--gold)}
#md p{margin:0 0 14px}
</style>
</head>

function save(){try{localStorage.setItem(K,JSON.stringify(D))}catch(e){}}
function key(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function longD(d){return DAYS[d.getDay()]+" "+d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear()}
function shortD(d){return DAYS[d.getDay()]+" "+d.getDate()+"/"+(d.getMonth()+1)+"/"+d.getFullYear()}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function toast(m){var t=document.getElementById("toast");t.textContent=m;t.className="s";setTimeout(function(){t.className=""},1900)}
function openM(h){document.getElementById("mb").innerHTML=h;document.getElementById("md").className="on"}
function closeM(){document.getElementById("md").className="";cb=null}
function ask(msg,label,fn,danger){cb=fn;openM('<p>'+msg+'</p><div class="act" style="margin:0"><button class="btn" onclick="closeM()">إلغاء</button><button class="btn '+(danger?"dng":"pri")+'" onclick="var f=cb;closeM();f&&f()">'+label+'</button></div>')}
function recorded(k){var o=D.att[k];return o&&Object.keys(o).length>0}
function sk(){return key(S[cur])}
function go(n){cur=Math.max(0,Math.min(S.length-1,cur+n));render()}
function jump(v){cur=+v;render()}
function mark(id,s){var k=sk();D.att[k]=D.att[k]||{};if(D.att[k][id]===s)delete D.att[k][id];else D.att[k][id]=s;save();render()}
function allP(){var k=sk();D.att[k]=D.att[k]||{};D.students.forEach(function(s){if(!D.att[k][s.id])D.att[k][s.id]="P"});save();render()}
function clearW(){ask("هل تريد مسح كل التسجيلات لحصة "+esc(shortD(S[cur]))+"؟","مسح",function(){delete D.att[sk()];save();render()},true)}
function addS(){var v=document.getElementById("ns").value.split("\n").map(function(x){return x.trim()}).filter(Boolean);
if(!v.length)return;v.forEach(function(n,i){D.students.push({id:Date.now().toString(36)+i,name:n})});save();render();toast("تمت إضافة "+v.length+" طالب")}
function delS(id){var s=D.students.filter(function(x){return x.id===id})[0];if(!s)return;
ask("هل تريد حذف <b>"+esc(s.name)+"</b> وجميع سجلات حضوره؟","حذف",function(){
D.students=D.students.filter(function(x){return x.id!==id});for(var k in D.att)delete D.att[k][id];save();render();toast("تم حذف الطالب")},true)}
function editS(id){editId=id;render();var i=document.getElementById("en");if(i){i.focus();i.select()}}
function saveE(){var v=document.getElementById("en").value.trim();if(!v){toast("الاسم لا يمكن أن يكون فارغاً");return}
D.students.forEach(function(s){if(s.id===editId)s.name=v});editId=null;save();render();toast("تم تعديل الاسم")}
function cancelE(){editId=null;render()}
function stats(id){var P=0,A=0,L=0;for(var k in D.att){var s=D.att[k][id];if(s=="P")P++;else if(s=="A")A++;else if(s=="L")L++}return{P:P,A:A,L:L}}
function keys(){return Object.keys(D.att).filter(recorded).sort()}
function csv(){var ks=keys(),out=[["الاسم"].concat(ks,["حاضر","غائب","متأخر"]).join(",")];
D.students.forEach(function(s){var st=stats(s.id);out.push(['"'+s.name.replace(/"/g,'""')+'"'].concat(ks.map(function(k){var x=D.att[k][s.id];return x?LBL[x]:""}),[st.P,st.A,st.L]).join(","))});return out.join("\n")}
function copy(){var t=csv();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("تم النسخ – الصقه في Excel أو Google Sheets")},showCopy)}else showCopy();
function showCopy(){openM('<p>حدّد الكل ثم انسخ:</p><textarea id="cp" readonly>'+esc(t)+'</textarea><div class="act"><button class="btn pri" onclick="closeM()">إغلاق</button></div>');var a=document.getElementById("cp");a.focus();a.select()}}
function dl(name,text,type){var b=new Blob([text],{type:type}),u=URL.createObjectURL(b),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u)},4000)}
async function saveFile(name,text,type){
var blob=new Blob([text],{type:type}),ext=name.split(".").pop();
if(window.showSaveFilePicker){try{var acc={};acc[type]=["."+ext];var fh=await window.showSaveFilePicker({suggestedName:name,types:[{description:ext.toUpperCase(),accept:acc}]});var w=await fh.createWritable();await w.write(blob);await w.close();toast("تم حفظ الملف في المجلد الذي اخترته ✓");return true}catch(e){if(e&&e.name==="AbortError")return false}}
try{var f=new File([blob],name,{type:type});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});toast("تمت العملية ✓");return true}}catch(e){if(e&&e.name==="AbortError")return false}
dl(name,text,type);toast("تم تنزيل الملف – ابحث عنه في مجلد التنزيلات");return true}
async function expJ(){var d=JSON.parse(JSON.stringify(D));d.lastBackup=new Date().toISOString();var ok=await saveFile("attendance-backup-"+key(new Date())+".json",JSON.stringify(d),"application/json");if(ok){D.lastBackup=d.lastBackup;save();render()}}
function saveS(){
if(!D.students.length){toast("لا يوجد طلاب");return}
var d=S[cur],c=D.att[sk()]||{},n=cur+1,P=0,A=0,L=0,U=0,L2=[];
D.students.forEach(function(s,i){var x=c[s.id];if(x=="P")P++;else if(x=="A")A++;else if(x=="L")L++;else U++;L2.push((i+1)+". "+s.name+" : "+(x?LBL[x]:"غير مسجّل"))});
var t="معهد زاد الدعاة\r\nالحصة رقم "+n+" – "+longD(d)+"\r\n------------------------------\r\n"+L2.join("\r\n")+"\r\n------------------------------\r\nحاضر: "+P+"  |  غائب: "+A+"  |  متأخر: "+L+(U?"  |  غير مسجّل: "+U:"")+"\r\nعدد الطلاب: "+D.students.length+"\r\n";
var name="الحصة رقم "+n+" بتاريخ "+d.getDate()+"-"+(d.getMonth()+1)+"-"+d.getFullYear()+".txt";
saveFile(name,"\ufeff"+t,"text/plain")}
function expC(){if(!keys().length){toast("لا توجد بيانات لحفظها بعد");return}saveFile("attendance-"+key(new Date())+".csv","\ufeff"+csv(),"text/csv")}
function impJ(inp){var f=inp.files[0];if(!f)return;var r=new FileReader();r.onload=function(){var d;try{d=JSON.parse(r.result);if(!d||!Array.isArray(d.students)||typeof d.att!=="object")throw 0}catch(e){openM('<p>هذا الملف ليس نسخة احتياطية صالحة.</p><div class="act"><button class="btn pri" onclick="closeM()">حسناً</button></div>');return}
ask("هل تريد استبدال البيانات على هذا الهاتف بالنسخة الاحتياطية ("+d.students.length+" طالب)؟","استعادة",function(){D=d;save();render();toast("تمت استعادة النسخة")},true)};r.readAsText(f);inp.value=""}
function lastB(){if(!D.lastBackup)return"لم تُحفظ بعد";var d=new Date(D.lastBackup);return d.getDate()+" "+MON[d.getMonth()]+" "+d.getFullYear()+" – "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")}

function render(){
["t1","t2","t3","t4"].forEach(function(id,i){document.getElementById(id).className=tab==i+1?"on":""});
var h="",c=D.att[sk()]||{};
if(tab==1){
h+='<div class="week"><button onclick="go(-1)" aria-label="السابق"'+(cur==0?" disabled":"")+'>›</button><div>'+longD(S[cur])+'<small>الحصة '+(cur+1)+' من '+S.length+'</small></div><button onclick="go(1)" aria-label="التالي"'+(cur==S.length-1?" disabled":"")+'>‹</button></div>';
h+='<select onchange="jump(this.value)">'+S.map(function(d,i){return'<option value="'+i+'"'+(i==cur?" selected":"")+'>'+shortD(d)+(recorded(key(d))?"  ✓":"")+'</option>'}).join("")+'</select>';
if(!D.students.length)h+='<div class="empty">لا يوجد طلاب بعد.<br>اذهب إلى تبويب «الطلاب» لإضافة قائمة الصف.</div>';
else{var P=0,A=0,L=0;D.students.forEach(function(s){var x=c[s.id];if(x=="P")P++;else if(x=="A")A++;else if(x=="L")L++});
h+='<div class="sum"><span><b style="color:var(--p)">'+P+'</b>حاضر</span><span><b style="color:var(--a)">'+A+'</b>غائب</span><span><b style="color:var(--l)">'+L+'</b>متأخر</span><span><b>'+(D.students.length-P-A-L)+'</b>غير مسجّل</span></div>';
h+='<div class="act"><button class="btn pri" onclick="allP()">الجميع حاضر</button><button class="btn" onclick="clearW()">مسح الحصة</button></div><div class="act" style="margin-top:0"><button class="btn pri" onclick="saveS()">💾 حفظ الحصة كملف نصي</button></div>';
D.students.forEach(function(s){var x=c[s.id];h+='<div class="row st"><div class="nm">'+esc(s.name)+'</div><div class="bt">'+["P","A","L"].map(function(m){return'<button class="'+m+(x==m?" on":"")+'" onclick="mark(\''+s.id+'\',\''+m+'\')">'+LBL[m]+'</button>'}).join("")+'</div></div>'});
h+='<div class="hint">يُحفظ تلقائياً على هذا الهاتف. علامة ✓ في القائمة تعني أن الحصة مسجّلة.</div>'}
}else if(tab==2){
var ks=keys();
if(!D.students.length||!ks.length)h+='<div class="empty">لم يُسجَّل أي حضور بعد.</div>';
else{h+='<div class="wrap"><table><tr><th>الاسم</th><th>حاضر</th><th>غائب</th><th>متأخر</th><th>النسبة</th></tr>';
D.students.forEach(function(s){var t=stats(s.id),n=t.P+t.A+t.L;h+='<tr><td>'+esc(s.name)+'</td><td style="color:var(--p)">'+t.P+'</td><td style="color:var(--a)">'+t.A+'</td><td style="color:var(--l)">'+t.L+'</td><td>'+(n?Math.round((t.P+t.L)/n*100)+"%":"–")+'</td></tr>'});
h+='</table></div><div class="hint">عدد الحصص المسجّلة: '+ks.length+'. النسبة = (حاضر + متأخر) ÷ الحصص المسجّلة للطالب.</div><div class="act"><button class="btn pri" onclick="expC()">حفظ الجدول كملف Excel</button><button class="btn" onclick="copy()">نسخ</button></div>'}
}else if(tab==4){
h+='<div class="hint">بياناتك محفوظة داخل المتصفح على هذا الهاتف. اضغط حفظ لإنشاء ملف حقيقي. على الهاتف ستظهر قائمة المشاركة: اختر «حفظ في الملفات» (آيفون) أو «حفظ على الجهاز» / Drive (أندرويد) ثم اختر المجلد. على الكمبيوتر (Chrome أو Edge) يُطلب منك اختيار المجلد مباشرة.</div>';
h+='<div class="hint"><b>آخر نسخة احتياطية:</b> '+lastB()+'</div>';
h+='<div class="act"><button class="btn pri" onclick="expJ()">حفظ ملف النسخة الاحتياطية</button></div>';
h+='<div class="act"><button class="btn" onclick="document.getElementById(\'fi\').click()">استعادة من ملف نسخة احتياطية</button></div><input id="fi" type="file" accept=".json,application/json" style="display:none" onchange="impJ(this)">';
h+='<div class="act"><button class="btn" onclick="expC()">حفظ الجدول كملف Excel (CSV)</button></div>';
h+='<div class="hint">نصيحة: احفظ نسخة في نهاية كل شهر. للانتقال إلى هاتف جديد، احفظ نسخة وأرسلها إلى الهاتف الجديد ثم استعدها هناك.</div>';
}else{
h+='<div class="hint">اكتب أو الصق الأسماء، اسماً في كل سطر:</div><textarea id="ns" placeholder="محمد أحمد&#10;خالد علي&#10;..."></textarea><div class="act"><button class="btn pri" onclick="addS()">إضافة الطلاب</button></div>';
if(D.students.length)h+='<div class="hint">عدد الطلاب: '+D.students.length+' · ✎ تعديل الاسم · ✕ حذف.</div>';
D.students.forEach(function(s){
if(editId===s.id)h+='<div class="row"><input type="text" id="en" value="'+esc(s.name)+'" onkeydown="if(event.key===\'Enter\')saveE()"><button class="ib e" onclick="saveE()">✔</button><button class="ib d" onclick="cancelE()">✕</button></div>';
else h+='<div class="row"><div class="nm">'+esc(s.name)+'</div><button class="ib e" aria-label="تعديل" onclick="editS(\''+s.id+'\')">✎</button><button class="ib d" aria-label="حذف" onclick="delS(\''+s.id+'\')">✕</button></div>'});
}
document.getElementById("v").innerHTML=h}
document.getElementById("t1").onclick=function(){tab=1;render()};
document.getElementById("t2").onclick=function(){tab=2;render()};
document.getElementById("t3").onclick=function(){tab=3;editId=null;render()};
document.getElementById("t4").onclick=function(){tab=4;render()};
render();
</script>
</body>
</html>
